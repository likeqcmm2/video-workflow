  lower_third: {name_font: "Noto Serif JP Medium", name_colour: "#ece6da", role_font: "Noto Sans JP",
                role_colour: "#c0c8cc", position: left, plate: true, plate_colour: "#101418", plate_opacity: 0.6}
  chapter_card: {enabled: true, duration: 3.0, gfx: chapter}
  transitions: {film_in: "fade:0.5", film_out: "fade:1.0", after_card: "dissolve:0.5"}
  motion: {still_zoom: 0.08, video_push: 0.03}
