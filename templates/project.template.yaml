# project.yaml - every engine setting for ONE video. Paths are relative to this directory.
# Full reference with defaults: engine/vf/config.py (DEFAULTS).  Docs: docs/05..09.
title: "{{TITLE}}"
language: {{LANG}}            # narration + on-screen text: ja | zh | ko | en | vi | ... (fonts/labels follow)

length:
  unit: chars                 # chars (CJK, whitespace removed) | words (space-separated languages)
  min: 10000                  # hard minimum for the TTS narration
  sample_hook: null           # Phase 1: measure with `vf count-sample sample.txt "<last words of hook>"`
  hook_tolerance: 0.15

copyright_level: balanced     # safe | balanced | max   (see docs/04-footage.md)
graphic_content: none         # none | limited          (never child victims)

voice:
  tts_model: gemini-3.8-flash-tts
  voice: Arlo
  asr_models: [gemini-3.8-flash, gemini-3.5-flash]
  readings: {}                # e.g. {"NASA": "ナサ", "Oリング": "オーリング"} - fixed pronunciations

director:                     # Phase 2 (docs/02) - decided for THIS title, no defaults
  genre: ""                   # genre + sub-genre + era, e.g. "history / 1940s naval war / newsreel archive"
  real_pct: {min: null, max: null}   # REQUIRED: range of real footage/photos in shot time (preflight checks film + each chapter)
  chapter_tolerance: 15       # a chapter may sit this many points outside the range ...
  chapter_exceptions: {}      # ... unless declared with a reason: {CH3: "the mechanism was never filmed"}

design:                       # Phase 7 (docs/07) - EVERYTHING here is this film's own decision; preflight lists what is missing
  grades:
    main: {}                  # REQUIRED: desat, contrast, warm [r,g,b], vignette, grain, gfx_grain, bottom (docs/07 table)
                              # add more named grades (e.g. per era) and pick them per chapter/shot with grade=<name>
  palette: {}                 # REQUIRED: the colours your graphics use, any keys (C.<key> in custom_gfx.py); "text" required
  fonts: {}                   # REQUIRED: role -> font file in vendor/fonts (fetch: scripts/fetch_fonts.py "Family:400,700")
  subtitle: {font: null}      # REQUIRED family names (fc-scan --format "%{fullname}\n" vendor/fonts/X.ttf)
  credit: {font: null}
  stamp: {font: null}
  lower_third: {name_font: null, role_font: null}
  chapter_card: {enabled: null, duration: 3.6, gfx: chapter}   # enabled REQUIRED; gfx = your g_<name> in custom_gfx.py
  transitions: {film_in: "fade:0.6", film_out: "fade:1.5", after_card: "fade:0.5"}   # cut | fade:<s> | dissolve:<s>
  motion: {still_zoom: null, video_push: 0.025}                # still_zoom REQUIRED (0 = static stills)

assets: {}                    # registered videos:  TAPE: {path: assets/ia/x.mp4, credit: "...", link: "...",
                              #   license: "...", rights_check: false, crop: [w,h,x,y], desat: 0.3}

music:
  chapters: {}                # HOOK: {file: assets/music/A.mp3}   CH4: {file: ..., offset: 120, cut_from_scene: S429}
  default: null
  credit: '"<title>" Kevin MacLeod (incompetech.com), CC BY 4.0'
